<!-- ================= 详细报错捕获 ================= -->
<script>
  // 移动端没有控制台，用弹窗直接查看错误
  window.addEventListener('error', function(e) {
    // 资源加载错误（如图片、JS文件 404 或网络超时）
    if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK' || e.target.tagName === 'IMG')) {
      var src = e.target.src || e.target.href;
      // 忽略一些不重要的图片报错
      if (src && src.indexOf('http') === 0 && src.indexOf(location.hostname) === -1) return;
      
      alert('❌ 资源加载失败:\n' + src + '\n\n可能原因：\n1. 文件路径拼写错误（区分大小写）\n2. 文件没有上传到 GitHub\n3. 网络无法访问该 CDN');
      return;
    }
    // 普通的 JS 运行错误
    alert('❌ 运行错误:\n' + e.message + '\n\n位置: ' + e.filename + ':' + e.lineno);
  }, true); // 开启捕获阶段，才能捕获资源加载失败

  // Promise 内部报错（ES Module 加载失败经常走这里）
  window.addEventListener('unhandledrejection', function(e) {
    var msg = e.reason;
    if (msg instanceof Error) {
      alert('❌ Promise 异常 (常见于模块加载):\n' + msg.message + '\n\n检查是否路径拼写错误或网络原因。');
    } else {
      alert('❌ 异步异常:\n' + msg);
    }
  });
</script>

<input type="file" id="imageFileInput" accept="image/*" hidden>
<input type="file" id="importFilesInput" multiple hidden>
<input type="file" id="importFolderInput" multiple webkitdirectory directory hidden>

<div class="newfile-mask" id="newfileMask">
  <div class="nf-header">
    <button class="nf-close" id="nfClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
    <div class="nf-title">新建文件</div>
    <div class="nf-spacer"></div>
  </div>
  <div class="nf-body">
    <div class="nf-input-row">
      <div class="nf-input-icon" id="nfInputIcon"></div>
      <input class="nf-input" id="nfInput" placeholder="文件名" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" />
      <button class="nf-ext-btn" id="nfExtBtn">
        <span id="nfExtText">.html</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 15 12 9 18 15"/>
          <polyline points="6 9 12 3 18 9" transform="translate(0 6)"/>
        </svg>
      </button>
    </div>
    <div class="nf-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      <span>保存在 <strong id="nfProjectName">—</strong> 中</span>
    </div>
    <button class="nf-create-btn" id="nfCreateBtn" disabled>创建</button>
  </div>
</div>

<div class="lang-mask" id="langMask">
  <div class="lang-sheet">
    <div class="lang-header">
      <div class="lang-title">选择语言</div>
      <button class="lang-close" id="langClose">取消</button>
    </div>
    <div class="lang-list" id="langList"></div>
  </div>
</div>

<div class="sheet-mask" id="findSheet">
  <div class="sheet">
    <div class="sheet-header"><div class="sheet-title">查找和替换</div><button class="sheet-close" data-close>完成</button></div>
    <div class="sheet-body">
      <div class="field-row"><input type="text" id="findInput" placeholder="查找内容" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field-row"><input type="text" id="replaceInput" placeholder="替换为" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field-hint" id="findHint">未开始查找</div>
      <div class="btn-row">
        <button class="btn-sm" id="findPrevBtn">上一个</button>
        <button class="btn-sm" id="findNextBtn">下一个</button>
        <button class="btn-sm" id="replaceBtn">替换</button>
        <button class="btn-sm primary" id="replaceAllBtn">全部替换</button>
      </div>
    </div>
  </div>
</div>

<div class="sheet-mask" id="statsSheet">
  <div class="sheet">
    <div class="sheet-header"><div class="sheet-title">文档统计</div><button class="sheet-close" data-close>完成</button></div>
    <div class="sheet-body"><div class="stat-grid" id="statsGrid"></div></div>
  </div>
</div>

<div class="sheet-mask" id="regexSheet">
  <div class="sheet">
    <div class="sheet-header"><div class="sheet-title">正则表达式测试</div><button class="sheet-close" data-close>完成</button></div>
    <div class="sheet-body">
      <div class="field-row"><input type="text" id="regexPattern" placeholder="正则表达式（不带斜杠）" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field-row"><input type="text" id="regexFlags" placeholder="flags（g i m s u y，可空）" autocapitalize="off" autocorrect="off" spellcheck="false" value="g"></div>
      <div class="field-hint">测试文本默认取当前编辑器内容</div>
      <textarea id="regexText" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      <div class="field-hint" id="regexHint"></div>
      <div class="regex-result" id="regexResult">等待输入…</div>
    </div>
  </div>
</div>

<div class="sheet-mask" id="settingsSheet">
  <div class="sheet">
    <div class="sheet-header"><div class="sheet-title">编辑器设置</div><button class="sheet-close" data-close>完成</button></div>
    <div class="sheet-body">
      <div class="setting-line">
        <span>字号</span>
        <div class="seg" id="segFontSize">
          <button data-val="12">12</button>
          <button data-val="14">14</button>
          <button data-val="16">16</button>
          <button data-val="18">18</button>
        </div>
      </div>
      <div class="setting-line">
        <span>Tab 宽度</span>
        <div class="seg" id="segTabSize">
          <button data-val="2">2 空格</button>
          <button data-val="4">4 空格</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal-card">
    <div class="modal-body">
      <div class="modal-title" id="modalTitle">创建新项目</div>
      <div class="modal-desc" id="modalDesc">输入您的项目的名称。</div>
      <input class="modal-input" id="projectNameInput" type="text" placeholder="My Project" autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>
    <div class="modal-actions">
      <button class="modal-btn" id="cancelBtn">取消</button>
      <button class="modal-btn" id="createBtn">创建</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="confirmMask">
  <div class="modal-card">
    <div class="modal-body">
      <div class="modal-title" id="confirmTitle">要删除吗？</div>
      <div class="modal-desc" id="confirmDesc"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" id="confirmCancel">取消</button>
      <button class="modal-btn danger" id="confirmOk">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="save-indicator" id="saveIndicator">已保存</div>

<script src="./js/pwa.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
